name: Build ALLXITERCSR APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Prepare
        run: |
          ZIPFILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          rm -rf build-src
          unzip -o "$ZIPFILE" -d build-src
          cp build-src/ALLXITERCSR_GitHub_Project/scripts/prepare_and_build.sh ./prepare_and_build.sh
          chmod +x ./prepare_and_build.sh
          ls -R build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool & build-tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y apktool zipalign
          # Install apksigner via sdkmanager
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
          echo "${ANDROID_SDK_ROOT}/build-tools/34.0.0" >> $GITHUB_PATH
          ls ${ANDROID_SDK_ROOT}/build-tools/34.0.0/ | grep apksigner
          apktool --version
          apksigner --version || ${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner --version

      - name: Run Original Build Script
        run: |
          ./prepare_and_build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ALLXITERCSR-APK
          path: |
            **/*.apk
            **/dist/*.apk
