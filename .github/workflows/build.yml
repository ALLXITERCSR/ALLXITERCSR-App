name: Build ALLXITERCSR APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Prepare
        run: |
          ZIPFILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          rm -rf build-src
          unzip -o "$ZIPFILE" -d build-src
          ls -R build-src
          cp build-src/ALLXITERCSR_GitHub_Project/scripts/prepare_and_build.sh ./prepare_and_build.sh
          chmod +x ./prepare_and_build.sh
          cat ./prepare_and_build.sh | head -n 100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Original Build Script
        run: |
          ./prepare_and_build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ALLXITERCSR-APK
          path: |
            **/*.apk
            build/**/*.apk
            app/build/outputs/**/*.apk
            **/build/outputs/apk/**/*.apk
