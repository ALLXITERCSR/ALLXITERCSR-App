name: Build ALLXITERCSR APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          rm -rf build-src
          unzip -o ALLXITERCSR_Project_with_Cloud_Build.zip -d build-src
          echo "Project at build-src/ALLXITERCSR"
          ls -la build-src/ALLXITERCSR/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd build-src/ALLXITERCSR
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLXITERCSR-APK
          path: |
            build-src/ALLXITERCSR/app/build/outputs/apk/debug/*.apk
            **/*.apk
