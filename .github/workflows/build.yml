name: Build ALLXITERCSR APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          ls -la
          echo "Cari file zip..."
          find . -maxdepth 2 -name "*.zip" -ls
          ZIPFILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "ZIP ketemu: $ZIPFILE"
          rm -rf build-src
          mkdir build-src
          unzip -o "$ZIPFILE" -d build-src
          ls -R build-src | head -n 200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          PROJECT_DIR=$(find build-src -type f -name "gradlew" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find build-src -type f -name "settings.gradle*" | head -n 1 | xargs dirname)
          fi
          echo "Build in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLXITERCSR-APK
          path: build-src/**/apk/debug/*.apk
