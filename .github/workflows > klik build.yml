name: Build ALLXITERCSR APK
on:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unzip Project
        run: |
          unzip -o ALLXITERCSR_Project_with_Cloud_Build.zip -d app-src
          ls -R app-src | head -n 150
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          DIR=$(find app-src -name "gradlew" -exec dirname {} \; | head -n1)
          echo "Build in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ALLXITERCSR-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
